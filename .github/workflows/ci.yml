name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tests/js/frontend.test.mjs
      - name: OpenAPI export is up to date
        run: python -m scripts.export_openapi && git diff --exit-code docs/openapi.json
        env: { GEMINI_API_KEY: ci-placeholder }
